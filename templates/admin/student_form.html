{% extends "base.html" %}

{% block page_heading %}
    Add Student
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Add Student</h1>
        <p>Create a student account without setting their password.</p>
    </div>

</div>


<div class="content-card">

    <form method="post">

        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >
            </div>

            <div class="form-group">
                <label>Student ID</label>
                <input
                    type="text"
                    name="student_id"
                    class="form-control"
                    required
                >
            </div>

            <div class="form-group">
                <label>First Name</label>
                <input
                    type="text"
                    name="first_name"
                    class="form-control"
                    required
                >
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input
                    type="text"
                    name="last_name"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input
                    type="text"
                    name="phone"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label>Department</label>

                <select
                    name="department"
                    class="form-control"
                    required
                >

                    <option value="">
                        Select Department
                    </option>

                    {% for department in departments %}

                    <option value="{{ department.id }}">
                        {{ department.name }} ({{ department.code }})
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">
                <label>Year</label>

                <select
                    name="year"
                    class="form-control"
                    required
                >

                    <option value="">Select Year</option>
                    <option value="1">Year 1</option>
                    <option value="2">Year 2</option>
                    <option value="3">Year 3</option>
                    <option value="4">Year 4</option>

                </select>

            </div>

            <div class="form-group">
                <label>Section</label>
                <input
                    type="text"
                    name="section"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label>Batch</label>
                <input
                    type="text"
                    name="batch"
                    class="form-control"
                    placeholder="2023-2027"
                >
            </div>

<!--            <div class="form-group">-->
<!--                <label>CGPA</label>-->
<!--                <input-->
<!--                    type="number"-->
<!--                    name="cgpa"-->
<!--                    class="form-control"-->
<!--                    min="0"-->
<!--                    max="10"-->
<!--                    step="0.01"-->
<!--                    value="0"-->
<!--                >-->
<!--            </div>-->

        </div>


        <div style="
            display:flex;
            justify-content:flex-end;
            gap:10px;
            margin-top:20px;
        ">

            <a
                href="{% url 'admin-students' %}"
                class="btn btn-light"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Student
            </button>

        </div>

    </form>

</div>

{% endblock %}
