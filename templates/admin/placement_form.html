{% extends "base.html" %}

{% block page_heading %}
    Add Placement Officer
{% endblock %}


{% block content %}

<div class="page-header">

    <div>

        <h1>Add Placement Officer</h1>

        <p>
            Create a placement cell account.
        </p>

    </div>

</div>


<div class="content-card">

    <form method="post">

        {% csrf_token %}


        <div class="form-grid">

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    First Name
                </label>

                <input
                    type="text"
                    name="first_name"
                    class="form-control"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Last Name
                </label>

                <input
                    type="text"
                    name="last_name"
                    class="form-control"
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                >

            </div>

        </div>


        <div style="
            display:flex;
            justify-content:flex-end;
            gap:10px;
            margin-top:25px;
        ">

            <a
                href="{% url 'admin-placement' %}"
                class="btn btn-light"
            >
                Cancel
            </a>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Placement Officer
            </button>

        </div>

    </form>

</div>

{% endblock %}
