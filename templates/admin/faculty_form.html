{% extends "base.html" %}

{% block page_heading %}
    Add Faculty
{% endblock %}


{% block content %}

<div class="page-header">

    <div>

        <h1>Add Faculty</h1>

        <p>
            Create a faculty account.
        </p>

    </div>

</div>


<div class="content-card">

    <form method="post">

        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >
            </div>


            <div class="form-group">
                <label>Faculty ID</label>

                <input
                    type="text"
                    name="faculty_id"
                    class="form-control"
                    required
                >
            </div>


            <div class="form-group">
                <label>First Name</label>

                <input
                    type="text"
                    name="first_name"
                    class="form-control"
                    required
                >
            </div>


            <div class="form-group">
                <label>Last Name</label>

                <input
                    type="text"
                    name="last_name"
                    class="form-control"
                >
            </div>


            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                >
            </div>


            <div class="form-group">
                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                >
            </div>


            <div class="form-group">

                <label>Department</label>

                <select
                    name="department"
                    class="form-control"
                    required
                >

                    <option value="">
                        Select Department
                    </option>

                    {% for department in departments %}

                    <option value="{{ department.id }}">
                        {{ department.name }}
                        ({{ department.code }})
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>Designation</label>

                <input
                    type="text"
                    name="designation"
                    class="form-control"
                    placeholder="Example: Assistant Professor"
                >

            </div>

        </div>


        <div style="
            display:flex;
            justify-content:flex-end;
            gap:10px;
            margin-top:25px;
        ">

            <a
                href="{% url 'admin-faculty' %}"
                class="btn btn-light"
            >
                Cancel
            </a>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Faculty
            </button>

        </div>

    </form>

</div>

{% endblock %}
