{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Set Password - College Portal</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>


<body>

    <div class="login-page">

        <div class="login-container">

            <div class="login-card">


                <!-- Logo -->

                <div class="login-logo">

                    <h1>
                        College Portal
                    </h1>

                    <p>
                        Create your login password
                    </p>

                </div>


                <!-- Messages -->

                {% if messages %}

                    {% for message in messages %}

                        <div class="message {{ message.tags }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}


                <!-- Password Form -->

                <form method="post">

                    {% csrf_token %}


                    <!-- Username -->

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            value="{{ user.username }}"
                            readonly
                        >

                    </div>


                    <!-- New Password -->

                    <div class="form-group">

                        <label for="password1">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="password1"
                            name="password1"
                            class="form-control"
                            minlength="8"
                            required
                            placeholder="Enter new password"
                        >

                    </div>


                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label for="password2">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="password2"
                            name="password2"
                            class="form-control"
                            minlength="8"
                            required
                            placeholder="Confirm new password"
                        >

                    </div>


                    <!-- Button -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                        style="width: 100%;"
                    >
                        Set Password
                    </button>

                </form>


                <p style="
                    margin-top: 18px;
                    text-align: center;
                    font-size: 12px;
                    color: #64748b;
                ">
                    After setting your password, you can log in
                    to the College Portal.
                </p>


            </div>

        </div>

    </div>

</body>

</html>
